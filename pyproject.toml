[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gee-workbench-macos"
version = "0.1.2"
description = "Unofficial, privacy-conscious macOS research workbench for the Google Earth Engine Python API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shaowen Ye"}]
keywords = ["earth-engine", "geemap", "jupyterlab", "qgis", "macos", "remote-sensing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "earthengine-api>=1.5,<2",
  "geemap>=0.35,<1",
  "jupyterlab>=4,<5",
  "pandas>=2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
gee-workbench = "gee_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/Shaowen-Ye/gee-workbench-macos"
Issues = "https://github.com/Shaowen-Ye/gee-workbench-macos/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
